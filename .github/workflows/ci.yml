name: CI

on:
  pull_request:
  push:
    branches: [main, build/strata]

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      STRATA_TEST_ADMIN_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen --extra ocr-fallback
      - run: uv run ruff check services tests scripts
      - run: uv run pytest -q --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-test-results, path: test-results}

  eval:
    # docs/05 evaluation: run the gold set on each change to a prompt, a model, a schema, the rules or a validator.
    # The run fails when a metric is below its target or falls by more than two points against the baseline.
    name: Agent evaluation on the gold set
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            enrichment:
              - 'prompts/**'
              - 'config/models.yaml'
              - 'config/agent-schemas.yaml'
              - 'config/enrichment-rules.yaml'
              - 'config/eval-targets.yaml'
              - 'config/tiers.yaml'
              - 'config/lifecycle*.yaml'
              - 'config/taxonomy/**'
              - 'services/enrichment/**'
              - 'tests/eval/**'
      - if: steps.changes.outputs.enrichment == 'true'
        uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - if: steps.changes.outputs.enrichment == 'true'
        run: uv sync --frozen
      - name: Evaluate with the deterministic backend
        if: steps.changes.outputs.enrichment == 'true'
        env:
          STRATA_AGENT_BACKEND: deterministic
        run: uv run python -m services.enrichment.eval --backend deterministic
      - name: Evaluate with the Anthropic backend (only when the secret exists)
        if: steps.changes.outputs.enrichment == 'true' && env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRATA_AGENT_BACKEND: anthropic
        run: uv run python -m services.enrichment.eval --backend anthropic
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.enrichment == 'true'
        with: {name: eval-results, path: tests/eval/results}

  frontend:
    name: Frontend lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  frontend-e2e:
    name: Frontend end to end, accessibility and visual parity (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the pinned Playwright version
        run: pnpm --filter @strata/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Skips with "blocked: no Infora audit (beta.infora.io unreachable)" until audit/ exists.
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-e2e-results
          path: |
            apps/web/test-results
            packages/design-system/test-results

  api-client:
    name: OpenAPI schema and typed client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm api-client
      - name: The committed client matches the API
        run: git diff --exit-code packages/api-client

  audit-tool:
    name: Infora audit tool tests (mock site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pnpm --dir tools/audit install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir tools/audit exec playwright install --with-deps chromium
      - run: pnpm --dir tools/audit test

  e2e:
    # docs/09 scenarios 1 to 17 and docs/07 criteria 5 to 7 on the Docker Compose stack. The job starts from a clean
    # clone with `make setup` and `docker compose up --build`, so it also proves docs/02 criterion 1.
    name: End to end acceptance tests on the Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      E2E_BUILD: --build
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # scenario 11 scans the whole history
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: uv sync --frozen
      - name: Make .env with random secrets
        run: make setup
      - name: Build and start the stack from the clean clone, with the fixture server
        id: up
        run: make e2e-up
      - name: Install the browser suite and Chromium
        run: |
          pnpm --dir tests/e2e/browser install --ignore-workspace --frozen-lockfile
          pnpm --dir tests/e2e/browser exec playwright install --with-deps chromium
      - name: Start-up log check (no ERROR or Traceback outside the known benign lines)
        continue-on-error: true
        run: E2E_COMPOSE="docker compose -p strata-e2e -f docker-compose.yml -f tests/e2e/compose.e2e.yml --profile test" uv run python tests/e2e/check_logs.py
      - name: Python end to end suite
        run: make e2e-python
      - name: Browser end to end suite
        if: always() && steps.up.outcome == 'success'
        run: make e2e-browser
      - name: Write the logs of the stack
        if: always()
        run: make e2e-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/e2e

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan the repository and its history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
