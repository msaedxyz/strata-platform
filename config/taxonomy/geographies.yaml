# Corridors
- code: corr_kasumbalesa
  name: Kasumbalesa corridor
  level: corridor
  countries: [zm, cd]
  description: "Road corridor from the Copperbelt (T3) through the Kasumbalesa border post to Katanga in the DRC."
- code: corr_lobito
  name: Lobito corridor
  level: corridor
  countries: [zm, ao, cd]
  description: "Rail and road corridor from the Copperbelt and North-Western Province through Jimbe to the port of Lobito in Angola. Includes the Zambia-Lobito greenfield rail line and the Mwinilunga-Jimbe (T5) road."
- code: corr_dar_es_salaam
  name: Dar es Salaam corridor
  level: corridor
  countries: [zm, tz]
  description: "TAZARA railway, TAZAMA pipeline and the T2 road through Nakonde and Tunduma to the port of Dar es Salaam."
- code: corr_chirundu_beitbridge
  name: Chirundu-Beitbridge corridor
  level: corridor
  countries: [zm, zw]
  description: "Regional road corridor from Lusaka through the Chirundu one-stop border post and Zimbabwe to South Africa."
- code: corr_trans_caprivi
  name: Trans-Caprivi corridor
  level: corridor
  countries: [zm, na]
  description: "Road corridor through the Katima Mulilo bridge at Sesheke to Namibia."
