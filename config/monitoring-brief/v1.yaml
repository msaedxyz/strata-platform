# ---------------------------------------------------------------------------
# Themes. Each keyword is a hint for the Classifier (docs/05-enrichment.md).
# config/taxonomy/activity-types.yaml has one entry for each keyword.
# ---------------------------------------------------------------------------
themes:
  # project_pipeline
  - code: new_mine_project
    name: "New mine project"
    direction: project_pipeline
    keywords: ["new mine", "greenfield mine", "mine development", "groundbreaking", "ground-breaking ceremony"]
  - code: mine_expansion
    name: "Mine expansion"
    direction: project_pipeline
    keywords: ["mine expansion", "expansion project", "new shaft", "shaft sinking", "super pit"]
  - code: mine_restart
    name: "Mine restart"
    direction: project_pipeline
    keywords: ["restart", "reopen", "resume production", "dewatering", "recapitalisation"]
  - code: exploration_drilling
    name: "Exploration and resource definition"
    direction: project_pipeline
    keywords: ["exploration licence", "drilling programme", "drill results", "mineral resource estimate", "JORC", "NI 43-101"]
  - code: feasibility_study
    name: "Feasibility study"
    direction: project_pipeline
    keywords: ["feasibility study", "pre-feasibility study", "scoping study", "definitive feasibility study", "bankable feasibility study", "engineering study"]
  - code: eia_filed
    name: "Environmental assessment filed"
    direction: project_pipeline
    keywords: ["environmental impact assessment", "environmental impact statement", "ESIA", "environmental project brief", "public disclosure meeting", "public consultation meeting"]
  - code: eia_approved
    name: "Environmental approval"
    direction: project_pipeline
    keywords: ["ZEMA approval", "environmental approval", "decision letter", "environmental authorisation"]
  - code: mining_licence_granted
    name: "Mining licence granted or transferred"
    direction: project_pipeline
    keywords: ["mining licence granted", "large-scale mining licence", "mining right", "licence renewal", "licence transfer"]
  - code: financing_close
    name: "Financing close or investment decision"
    direction: project_pipeline
    keywords: ["financial close", "final investment decision", "FID", "loan approved", "project financing", "equity raise"]
  - code: power_project
    name: "Power project"
    direction: project_pipeline
    keywords: ["power plant construction", "solar plant", "hydropower project", "power purchase agreement", "PPA signed", "megawatt project"]
  - code: transport_infrastructure_project
    name: "Transport infrastructure project"
    direction: project_pipeline
    keywords: ["road upgrade", "dual carriageway", "railway rehabilitation", "greenfield rail", "concession agreement", "one-stop border post"]
  - code: industrial_project
    name: "Industrial project"
    direction: project_pipeline
    keywords: ["new factory", "processing plant", "smelter project", "refinery upgrade", "investment licence", "economic zone investment"]
  - code: agri_expansion
    name: "Agricultural expansion"
    direction: project_pipeline
    keywords: ["irrigation project", "farm block", "commercial farm expansion", "centre pivot", "hectares under irrigation"]

  # procurement
  - code: tender_notice
    name: "Tender notice"
    direction: procurement
    keywords: ["tender", "invitation to bid", "request for proposals", "RFP", "bid notice", "invitation for bids"]
  - code: eoi_notice
    name: "Expression of interest"
    direction: procurement
    keywords: ["expression of interest", "EOI", "request for information", "general procurement notice"]
  - code: prequalification_notice
    name: "Prequalification"
    direction: procurement
    keywords: ["prequalification", "pre-qualification", "supplier registration", "vendor registration", "approved supplier list"]
  - code: contractor_award
    name: "Contractor award"
    direction: procurement
    keywords: ["contract awarded", "awarded the contract", "EPC contract", "preferred bidder", "selected contractor"]
  - code: contract_mining
    name: "Contract mining"
    direction: procurement
    keywords: ["contract mining", "mining contractor", "load and haul", "drill and blast", "waste stripping"]
  - code: haulage_contract
    name: "Haulage contract"
    direction: procurement
    keywords: ["haulage contract", "transport contract", "trucking contract", "ore haulage", "concentrate haulage"]
  - code: fleet_purchase
    name: "Fleet purchase"
    direction: procurement
    keywords: ["fleet purchase", "haul trucks", "mining fleet", "new locomotives", "new wagons", "equipment order"]
  - code: fuel_supply_tender
    name: "Fuel supply tender"
    direction: procurement
    keywords: ["fuel supply contract", "diesel supply", "bulk fuel tender", "fuel tender", "supply of diesel"]

  # demand_up
  - code: load_shedding
    name: "Load shedding"
    direction: demand_up
    keywords: ["load shedding", "load-shedding", "power outage", "power rationing", "electricity deficit", "diesel generators"]
  - code: fuel_shortage
    name: "Fuel shortage"
    direction: demand_up
    keywords: ["fuel shortage", "diesel shortage", "fuel scarcity", "fuel queues", "dry pumps"]
  - code: pipeline_outage
    name: "Pipeline outage"
    direction: demand_up
    keywords: ["pipeline outage", "pipeline shutdown", "pipeline leak", "TAZAMA shutdown", "pipeline vandalism"]
  - code: construction_mobilisation
    name: "Construction or mobilisation"
    direction: demand_up
    keywords: ["mobilisation", "site establishment", "construction begins", "commence construction", "earthworks"]
  - code: commissioning_rampup
    name: "Commissioning and ramp up"
    direction: demand_up
    keywords: ["commissioning", "first production", "trial production", "first ore", "ramp-up", "commercial production"]
  - code: production_increase
    name: "Production increase"
    direction: demand_up
    keywords: ["record production", "increased output", "production guidance raised", "higher throughput"]
  - code: harvest_marketing
    name: "Harvest and crop marketing"
    direction: demand_up
    keywords: ["bumper harvest", "crop marketing season", "maize marketing", "FRA purchases", "harvest season"]

  # demand_down
  - code: suspension
    name: "Suspension"
    direction: demand_down
    keywords: ["suspended operations", "suspension", "stop order", "operations halted", "production halt"]
  - code: care_and_maintenance
    name: "Care and maintenance"
    direction: demand_down
    keywords: ["care and maintenance", "mothballed", "placed on care"]
  - code: closure
    name: "Closure"
    direction: demand_down
    keywords: ["mine closure", "plant closure", "shut down", "shutdown", "decommissioning"]
  - code: retrenchment
    name: "Retrenchment"
    direction: demand_down
    keywords: ["retrenchment", "layoffs", "job cuts", "redundancies"]
  - code: border_delay
    name: "Border delay or closure"
    direction: demand_down
    keywords: ["border delays", "truck queue", "border congestion", "border closure", "border closed"]
  - code: erb_price_change
    name: "ERB fuel price change"
    direction: demand_down
    keywords: ["fuel price increase", "pump price", "ERB fuel price", "price review", "fuel price adjustment"]
  - code: drought
    name: "Drought and crop failure"
    direction: demand_down
    keywords: ["drought", "low rainfall", "crop failure", "El Nino", "Kariba water levels"]
  - code: road_disruption
    name: "Road or rail disruption"
    direction: demand_down
    keywords: ["road closed", "bridge collapse", "washaway", "derailment", "road blocked"]

exclusions:
  - "football"
  - "soccer"
  - "Super Division"
  - "Nkana FC"
  - "Mufulira Wanderers"
  - "Kansanshi Dynamos"
  - "Challenge Cup"
  - "Konkola Mine Police F.C."
  - "lottery"
  - "betting"
  - "jackpot"
  - "beauty pageant"
  - "celebrity"
  - "music awards"
  - "horoscope"
  - "obituary"
  - "recipe"

