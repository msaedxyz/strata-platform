known_gaps:
  - {name: "Zambia Mining Cadastre", reason: "Research found no official URL for the cadastre portal. The web search budget of the session ended before a second search. Licence applications, grants and transfers are therefore not collected.", workaround: "manual upload"}
  - {name: "Government Gazette of Zambia", reason: "Research found no official online source for gazette notices.", workaround: "manual upload"}
  - {name: "PACRA company register", reason: "Research found no public feed and no terms for collection. Company numbers are therefore not in external_ids.", workaround: "manual upload"}
  - {name: "SEDAR+ filings", reason: "Research found no issuer filing URL for First Quantum, Barrick or GoviEx. The First Quantum news page is used instead.", workaround: "manual upload"}
  - {name: "LSE RNS filings", reason: "Research found only one RNS story (Bezant Resources, Kalengwa) and no RNS feed for Arc Minerals, Jubilee Metals or Gemfields.", workaround: "manual upload"}
  - {name: "JSE SENS announcements", reason: "Research found no JSE SENS source for the watched operators.", workaround: "manual upload"}
  - {name: "Lusaka Securities Exchange announcements", reason: "Research found no official LuSE announcements page. Two issuer pages on African Financials are used instead.", workaround: "manual upload"}
  - {name: "IFC project pages", reason: "Research found no IFC project page for a watched site.", workaround: "manual upload"}
  - {name: "DFC project pages", reason: "Research found no DFC project page for a watched site or the Lobito corridor.", workaround: "manual upload"}
  - {name: "ZESCO procurement notices", reason: "Research found no ZESCO procurement page. ZPPA e-GP can carry some ZESCO notices.", workaround: "manual upload"}
  - {name: "Road Development Agency procurement notices", reason: "Research found no RDA procurement page. ZPPA e-GP and AfDB notices cover part of it.", workaround: "manual upload"}
  - {name: "ZCCM-IH procurement notices", reason: "Research found no ZCCM-IH procurement page.", workaround: "manual upload"}
  - {name: "Ministry of Finance national budget documents", reason: "Research found no official budget speech or estimates page. Parliament and State House pages cover part of it.", workaround: "manual upload"}
  - {name: "Zambia Development Agency investment licences and MFEZ tenant lists", reason: "Research found only the ZDA conference project pages. No licence register or tenant list was found.", workaround: "manual upload"}
  - {name: "Job postings for watched sites and contractors", reason: "Research found no job board or careers page for the watched sites and contractors.", workaround: "manual upload"}
  - {name: "Zambia Monitor, Mining Review Africa and Zambia Daily Mail feeds", reason: "The web search budget ended before these feeds were found. Google News queries cover these publishers in part.", workaround: "manual upload"}
  - {name: "Paid sources (Wood Mackenzie, PitchBook, African Energy database, Mining Data Online)", reason: "Paid or subscription services appeared in results. Strata has no licence for them.", workaround: "manual upload"}
  - {name: "DRC side of the corridor", reason: "Brief v1 covers Zambia. Research did not cover Katanga mines, DRC customs at Kasumbalesa or DRC sources.", workaround: "manual upload"}

