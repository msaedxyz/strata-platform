  weights:
    watch_daily: 3.0
    watch_weekly: 1.5
    theme_direction_procurement: 3.0
    theme_direction_project_pipeline: 2.5
    theme_direction_demand_up: 2.0
    theme_direction_demand_down: 2.0
    early_signal_source: 2.0
    certainty_stated: 1.0
    certainty_reported: 0.5
    certainty_speculative: 0.2
    recency_days_half_life: 14
