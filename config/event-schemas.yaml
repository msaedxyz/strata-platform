# JSON schemas for event payloads. The governance service validates each payload before insert.
# Source: docs/03-data-model.md. Fields not listed are allowed, so that events can carry detail.
definitions:
  ids: {type: array, items: {type: string, minLength: 1}}
  certainty: {enum: [stated, reported, speculative]}
  date_or_null: {type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}"}
schemas:
  EntityIdentified:
    type: object
    required: [entity_type, name]
    properties:
      entity_type: {enum: [organisation, person, site, project, opportunity, location, market]}
      name: {type: string, minLength: 1}
      aliases: {type: array, items: {type: string}}
      site_class: {type: [string, "null"]}
      watch: {enum: [daily, weekly, none]}
      country: {type: [string, "null"]}
      district: {type: [string, "null"]}
      province: {type: [string, "null"]}
      external_ids: {type: object}
      resolution_confidence: {type: number, minimum: 0, maximum: 1}
  EntityAttributeAsserted:
    type: object
    required: [predicate, value]
    properties:
      predicate: {type: string}
      value: {}
      normalised: {}
  EntityMerged:
    type: object
    required: [merged_ids, into_id]
    properties:
      merged_ids: {type: array, items: {type: string}, minItems: 1}
      into_id: {type: string}
      reason: {type: string}
  EntitySplit:
    type: object
    required: [from_id, new_ids]
    properties:
      from_id: {type: string}
      new_ids: {type: array, items: {type: string}, minItems: 1}
      reason: {type: string}
  RelationshipAsserted:
    type: object
    required: [subject_id, predicate, object_id]
    properties:
      subject_id: {type: string}
      predicate: {type: string}
      object_id: {type: string}
  DealIdentified:
    type: object
    required: [title, deal_type]
    properties:
      title: {type: string, minLength: 1}
      deal_type: {type: string}
      stage: {type: string}
      site_id: {type: [string, "null"]}
      project_id: {type: [string, "null"]}
      organisation_id: {type: [string, "null"]}
  DealAttributeAsserted:
    type: object
    required: [predicate, value]
    properties:
      predicate: {type: string}
      value: {}
  DealStageChanged:
    type: object
    required: [to_stage]
    properties:
      from_stage: {type: [string, "null"]}
      to_stage: {type: string}
      reason: {type: string}
  SignalScored:
    type: object
    required: [source_id, title, url, tier, tier_rule, score, breakdown]
    properties:
      source_id: {type: string}
      title: {type: string}
      url: {type: string}
      publisher: {type: [string, "null"]}
      published_at: {type: [string, "null"]}
      fetched_at: {type: [string, "null"]}
      tier: {enum: [0, 1, 2]}
      tier_rule: {type: string}
      score: {type: number}
      breakdown: {type: object}
      sectors: {type: array, items: {type: string}}
      geographies: {type: array, items: {type: string}}
      themes: {type: array, items: {type: string}}
      directions: {type: array, items: {type: string}}
      deal_types: {type: array, items: {type: string}}
      entity_ids: {type: array, items: {type: string}}
      read_at_source: {type: boolean}
      summary: {type: [array, "null"]}
  DemandDriverObserved:
    type: object
    required: [driver_type, title, direction]
    properties:
      driver_type: {type: string}
      title: {type: string}
      direction: {enum: [demand_up, demand_down, procurement, project_pipeline]}
      geography: {type: array, items: {type: string}}
      observed_at: {type: [string, "null"]}
      source_id: {type: [string, "null"]}
  ProjectStageChanged:
    type: object
    required: [to_stage]
    properties:
      from_stage: {type: [string, "null"]}
      to_stage: {type: string}
      name: {type: string}
      site_id: {type: [string, "null"]}
      stage_event: {type: string}
  ProcurementWindowForecast:
    type: object
    required: [current_stage, intervals, start, end]
    properties:
      current_stage: {type: string}
      start: {$ref: "#/definitions/date_or_null"}
      end: {$ref: "#/definitions/date_or_null"}
      intervals:
        type: array
        items:
          type: object
          required: [from, to, median_days, n_projects, projects]
      shift_months_nearer: {type: [number, "null"]}
  DemandEstimated:
    type: object
    required: [formula_id, expression, inputs, value, unit, label]
    properties:
      formula_id: {type: string}
      expression: {type: string}
      inputs:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [value, evidence_ids]
          properties:
            evidence_ids: {type: array, items: {type: string}, minItems: 1}
      factors: {type: object}
      value: {type: number}
      unit: {type: string}
      label: {const: estimate}
  ContactAdded:
    type: object
    required: [contact_id, role, organisation_id, found_via]
    properties:
      contact_id: {type: string}
      role: {type: string}
      organisation_id: {type: [string, "null"]}
      found_via: {type: string}
      personal: {type: object}
  TouchpointLogged:
    type: object
    required: [kind, date, note]
    properties:
      kind: {enum: [call, meeting, email, site_visit]}
      date: {type: string}
      note: {type: string, maxLength: 2000}
      contact_id: {type: [string, "null"]}
  NextActionSet:
    type: object
    required: [action, owner_user_id, due_date]
    properties:
      action: {type: string, minLength: 1}
      owner_user_id: {type: string}
      due_date: {type: string}
  PrequalificationStatusChanged:
    type: object
    required: [buyer_id, status]
    properties:
      buyer_id: {type: string}
      status: {enum: [not_started, submitted, approved, rejected]}
  SiteStatusChanged:
    type: object
    required: [to_status]
    properties:
      from_status: {type: [string, "null"]}
      to_status: {enum: [producing, ramping_up, care_and_maintenance, suspended, closed, under_construction]}
  AlertRaised:
    type: object
    required: [tier, tier_rule, title]
    properties:
      tier: {enum: [0, 1, 2]}
      tier_rule: {type: string}
      title: {type: string}
      signal_id: {type: [string, "null"]}
      source_id: {type: [string, "null"]}
      related_stream_type: {type: [string, "null"]}
      related_stream_id: {type: [string, "null"]}
      published_at: {type: [string, "null"]}
      fetched_at: {type: [string, "null"]}
  AlertConfirmed:
    type: object
    properties:
      reason: {type: string}
  AlertDismissed:
    type: object
    properties:
      reason: {type: string}
      false_positive: {type: boolean}
  AlertAcknowledged:
    type: object
  ClaimRetracted:
    type: object
    required: [event_id, reason]
    properties:
      event_id: {type: string}
      reason: {type: string, minLength: 1}
  ProposalCreated:
    type: object
    required: [proposal_id, kind, policy]
  ProposalApproved:
    type: object
    required: [proposal_id]
  ProposalRejected:
    type: object
    required: [proposal_id, reason]
    properties:
      reason: {type: string, minLength: 1}
  ProposalEditedApproved:
    type: object
    required: [proposal_id]
  BriefVersionActivated:
    type: object
    required: [brief_version_id, version]
