# Historical lifecycle milestones for the window forecaster.
# Source: WebSearch results only, collected 2026-09-26. See reports/notes/research-lifecycle.md.
# Each milestone has a URL from a search result. No date is invented.
#
# Date format by date_precision:
#   day     -> YYYY-MM-DD
#   month   -> YYYY-MM
#   quarter -> YYYY-Qn
#   year    -> YYYY
#
# A note that starts with "VERIFY:" means that the search summary gave the date
# but did not show which listed page holds it. A human must check that page.

settings:
  target_stage: contractor_procurement
  min_projects: 5            # doc 05: fewer than five projects -> show stage only, no date
  days_per_month: 30.4375
  # Point date that the script uses for each precision.
  precision_point:
    day: exact
    month: day_15
    quarter: middle_month_day_15
    year: july_1
  # Half width of the uncertainty of each precision, in days.
  # If an interval is negative, but its size is not more than the sum of the
  # half widths of its two dates, the script sets it to 0 (concurrent).
  # A larger negative interval is "out of order" and is not in the statistics.
  precision_half_width_days:
    day: 0
    month: 15
    quarter: 45
    year: 182
  stage_order:
    - exploration
    - resource_defined
    - scoping_prefeasibility
    - feasibility
    - eia_filed
    - environmental_approval
    - licence_granted
    - financing_fid
    - contractor_procurement
    - construction_mobilisation
    - commissioning_rampup
    - steady_operation
    - care_maintenance_suspension_closure
  restart_order:
    - care_maintenance_suspension_closure
    - restart_plan
    - recapitalisation
    - contractor_procurement
    - restart

