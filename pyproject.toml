[project]
name = "strata-services"
version = "0.1.0"
description = "Strata backend services: API, collectors, enrichment, governance and projections"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "procrastinate>=2.14",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "python-ulid>=2.7",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.13",
  "pypdfium2>=4.30",
  "langdetect>=1.0.9",
  "boto3>=1.35",
  "anthropic>=0.40",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "sse-starlette>=2.1",
  "croniter>=3.0",
  "python-dateutil>=2.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# RapidOCR runs when the tesseract binary is not installed. The headless OpenCV build needs no X11
# libraries, so it works in the slim container image. The override below removes the GUI build.
ocr-fallback = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.5"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "pillow>=10.4",
]

[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 300
markers = [
  "db: needs a PostgreSQL database (STRATA_TEST_DATABASE_URL)",
  "stack: needs the full Docker Compose stack",
]
