# The access log writes the path without the query string, because the live stream carries the token
# in the query (EventSource cannot send headers). CLAUDE.md rule 5: never write a secret to a log.
log_format strata_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
  listen 8088;
  server_name _;
  access_log /var/log/nginx/access.log strata_noquery;
  root /usr/share/nginx/html;

  location /api/live {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
  }

  location / {
    try_files $uri /index.html;
  }
}
